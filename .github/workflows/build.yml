name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch, but never a tag build that publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Built on the oldest supported base (glibc 2.35): the archive then runs on newer systems too.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build qt6-base-dev qt6-wayland libgl1-mesa-dev patchelf

      - name: Check translations
        run: python3 scripts/check-translations.py

      # Version for "About": the tag without "v" for a release, otherwise the short commit hash.
      - name: Configure
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCASK_VERSION="$version"

      - name: Build
        run: cmake --build build

      - name: Bundle portable layout
        run: bash scripts/bundle-linux.sh build/Cask

      # Exit code 124 means the process was still alive when the timeout hit, i.e. the window started.
      - name: Smoke test (offscreen)
        run: |
          status=0
          QT_QPA_PLATFORM=offscreen timeout 3 build/Cask/cask || status=$?
          [ "$status" -eq 124 ] || { echo "Smoke test failed (exit code $status)"; exit 1; }

      - name: Archive
        run: tar -C build -czf Cask-linux-x86_64.tar.gz Cask

      - uses: actions/upload-artifact@v4
        with:
          name: Cask-linux-x86_64
          path: Cask-linux-x86_64.tar.gz

  # The portable archive must start on other distributions too, with the real xcb platform plugin on a
  # virtual X server (the offscreen test above never touches X11, XKB or the system libraries).
  # Each image has the runtime libraries of a desktop with Qt 6 installed, like a user's machine.
  distros:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm qt6-base xorg-server-xvfb tar gzip
          - name: Fedora
            image: fedora:latest
            install: dnf install -y qt6-qtbase-gui xorg-x11-server-Xvfb tar gzip
          - name: Debian 12
            image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends libqt6widgets6 xvfb xkb-data tar gzip
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends libqt6widgets6 xvfb xkb-data tar gzip
          - name: Debian
            image: debian:trixie
            install: apt-get update && apt-get install -y --no-install-recommends libqt6widgets6 xvfb xkb-data tar gzip
          - name: Ubuntu
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends libqt6widgets6 xvfb xkb-data tar gzip
          - name: openSUSE
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install --no-recommends libQt6Widgets6 xorg-x11-server-Xvfb xkeyboard-config tar gzip
    name: Start on ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: Install runtime libraries
        run: ${{ matrix.install }}

      - uses: actions/download-artifact@v4
        with:
          name: Cask-linux-x86_64

      - name: Unpack
        run: tar -xzf Cask-linux-x86_64.tar.gz

      - name: Libraries resolve
        run: |
          for f in Cask/cask Cask/lib/plugins/platforms/libqxcb.so; do
            if ldd "$f" | grep 'not found'; then echo "unresolved libraries in $f"; exit 1; fi
          done

      # Exit code 124 means the process was still alive when the timeout hit, i.e. the window started.
      - name: Start with the xcb platform
        run: |
          export HOME=/tmp/home XDG_RUNTIME_DIR=/tmp/runtime DISPLAY=:99 QT_QPA_PLATFORM=xcb
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          status=0
          timeout 5 Cask/cask || status=$?
          [ "$status" -eq 124 ] || { echo "Cask did not start (exit code $status)"; exit 1; }

  # The Wayland platform plugin on a real (headless) compositor. The platform is forced, so there is no
  # silent fallback to X11. The archive is unpacked on the runner itself (Ubuntu 24.04).
  wayland:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install a compositor
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends weston libqt6widgets6 xkb-data

      - uses: actions/download-artifact@v4
        with:
          name: Cask-linux-x86_64

      - name: Unpack
        run: tar -xzf Cask-linux-x86_64.tar.gz

      - name: Libraries resolve
        run: |
          for f in Cask/cask Cask/lib/plugins/platforms/libqwayland-generic.so; do
            if ldd "$f" | grep 'not found'; then echo "unresolved libraries in $f"; exit 1; fi
          done

      - name: Start with the Wayland platform
        run: |
          export HOME=/tmp/home XDG_RUNTIME_DIR=/tmp/runtime
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-test --idle-time=0 >/tmp/weston.log 2>&1 &
          sleep 3
          export WAYLAND_DISPLAY=wl-test QT_QPA_PLATFORM=wayland
          status=0
          timeout 5 Cask/cask || status=$?
          [ "$status" -eq 124 ] || { echo "Cask did not start (exit code $status)"; cat /tmp/weston.log; exit 1; }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed only to publish the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cask-linux-x86_64

      - uses: softprops/action-gh-release@v2
        with:
          files: Cask-linux-x86_64.tar.gz
          generate_release_notes: true

  # After a release, point the `nixos` branch (Nix packaging) at the new tag.
  nix-branch:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # pushes to the nixos branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nixos

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Point the flake at the release
        run: |
          tag="$GITHUB_REF_NAME"
          sed -i "s|github:ndiruhniu/cask/[^\"]*|github:ndiruhniu/cask/${tag}|" flake.nix
          grep -n "cask-src" -A1 flake.nix | head -4
          printf '{\n  "version": "%s",\n  "rev": "%s"\n}\n' "${tag#v}" "$GITHUB_SHA" > nix/release.json
          nix flake update cask-src

      - name: Check the build
        run: nix build .#default --print-build-logs --no-link

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock nix/release.json
          git commit -m "nix: update to ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:nixos
